<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark'; } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="title">TETRIS</h1>
    <button id="theme-btn" type="button" title="Cambiar tema (T)">Modo claro</button>

    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
            <li><kbd>T</kbd> tema</li>
          </ul>
        </div>
      </aside>

      <div id="overlay" class="overlay hidden">
        <div class="overlay-box">
          <p id="overlay-title">GAME OVER</p>
          <p id="overlay-score"></p>
          <form id="name-form" class="name-form hidden" autocomplete="off">
            <label for="name-input" class="label">¡NUEVO RÉCORD! TU NOMBRE</label>
            <div class="name-row">
              <input id="name-input" type="text" maxlength="12" />
              <button id="name-save-btn" type="submit">Guardar</button>
            </div>
          </form>
          <div id="over-records" class="records"></div>
          <button id="restart-btn">Reiniciar</button>
        </div>
      </div>

      <div id="start-overlay" class="overlay">
        <div class="overlay-box">
          <p id="start-title">TETRIS</p>
          <div id="start-records" class="records"></div>
          <button id="start-btn" type="button">Jugar</button>
          <p class="hint">o pulsa <kbd>Enter</kbd></p>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
